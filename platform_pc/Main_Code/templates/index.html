<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">

    <!-- Add Roboto font import -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
</head>

<body style="font-family: 'Roboto', sans-serif;">

        navigator.mediaDevices.getUserMedia({

                video: {

    <div class="pos-f-t">
        <div class="collapse" id="navbarToggleExternalContent">
            <div class="bg-dark p-4">
                <h5 class="text-white h4" style="color:#ffffff;">Project Beebot </h5>
                <span class="text-muted">.</span>
            </div>
        </div>
        <nav class="navbar navbar-dark bg-dark">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarToggleExternalContent" aria-controls="navbarToggleExternalContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div>
                <h5 style="color:white; font-family:Verdana, Geneva, Tahoma, sans-serif; padding-right:center"> Project Beebot | Swarm Robotics Platform</h5>
            </div>
        </nav>


    </div>

    <div style="display: flex; flex-direction: row; justify-content: center; align-items: flex-start; width: 100vw; min-height: 90vh; font-family: 'Roboto', sans-serif;">
        <!-- Robot Details Column (Left) -->
        <div style="height: 100vh; flex-direction:column; padding: 10px; overflow-y: auto; background-color: #343A40; padding: 15px; width:3.8in; font-family: 'Roboto', sans-serif;">
            <div>
                <h2 style="padding: 5px; color: white; font-weight: bold; font-size: 25px; text-align:center; font-family: 'Roboto', sans-serif;">Robot Details</h2>
            </div>
            <!-- Robot 1 Card -->
            <div style="padding: 5px;">
                <div class="card" style="font-family: 'Roboto', sans-serif;">
                    <h5 class="card-header" style="font-family: 'Roboto', sans-serif;">Robot 1</h5>
                    <div class="card-body" style="font-family: 'Roboto', sans-serif;">
                        <div style="padding-bottom:10px; padding-left: 90px;">
                            <span class="badge badge-success" style="background-color:#4be41c; border-radius:1.2em; font-family: 'Roboto', sans-serif;">Online</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 79%; font-family: 'Roboto', sans-serif;" aria-valuenow="79" aria-valuemin="0" aria-valuemax="100">79%</div>
                        </div>
                        <p> </p>
                        <button class="btn btn-danger" style="font-family: 'Roboto', sans-serif;">STOP</button>
                        <button class="btn btn-outline-secondary" style="font-family: 'Roboto', sans-serif;" onclick='return HomeBot1()'>HOME</button>
                    </div>
                </div>
            </div>
            <!-- Robot 2 Card -->
            <div style="padding: 5px;">
                <div class="card" style="font-family: 'Roboto', sans-serif;">
                    <h5 class="card-header" style="font-family: 'Roboto', sans-serif;">Robot 2</h5>
                    <div class="card-body" style="font-family: 'Roboto', sans-serif;">
                        <div style="padding-bottom:10px; padding-left: 90px;">
                            <span class="badge badge-success" style="background-color:#4be41c; border-radius:1.2em; font-family: 'Roboto', sans-serif;">Online</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 85%; font-family: 'Roboto', sans-serif;" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100">85%</div>
                        </div>
                        <p></p>
                        <button class="btn btn-danger" style="font-family: 'Roboto', sans-serif;">STOP</button>
                        <button class="btn btn-outline-secondary" style="font-family: 'Roboto', sans-serif;" onclick='return HomeBot2()'>HOME</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Camera Screen (Center) -->
        <div class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; background-color: #858688; min-width: 700px; font-family: 'Roboto', sans-serif;">
            <div class="w3-container w3-cursive">
                <h1 style="font-weight: bold; font-style: normal; font-family: 'Roboto', sans-serif; font-size: 30px;">TOP VIEW</h1>
            </div>
            <div class="container" style="background-color: #707174; padding: 20px; display: flex; justify-content: center; align-items: center;">
                <div id="camera-container" style="position: relative; display: flex; justify-content: center; align-items: center;">
                    <img id="video-feed" src="{{ url_for('video_feed') }}" width="640" height="480" style="display: block; margin: 0 auto;">
                    <div id="camera-error" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; font-family: 'Roboto', sans-serif;">
                        <h3>Camera Feed Unavailable</h3>
                        <p>Please check camera connection and refresh the page</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Main Controllers (Right) -->
        <div style="display: flex; flex-direction: column; padding: 10px; background-color: #161A1D; padding: 15px; width:3in; font-family: 'Roboto', sans-serif;">
            <div>
                <h2 style="padding: 5px; color: white; font-weight: bold; text-align:center; padding-bottom:1in; font-family: 'Roboto', sans-serif;">Control Panel</h2>
            </div>
            <div style="padding: 10px; ">
                <button type="button" class="btn btn-primary" style="padding: 15px; width:100%; font-family: 'Roboto', sans-serif;" onclick='return start()'>START</button>
            </div>
            <div style="padding: 10px; ">
                <button type="button" class="btn btn-secondary" style="padding: 15px; width:100%; font-family: 'Roboto', sans-serif;" onclick='return pause()'>PAUSE</button>
            </div>
            <div style="padding: 10px; ">
                <button type="button" class="btn btn-success" style="padding: 15px; width:100%; font-family: 'Roboto', sans-serif;" onclick='return home()'>HOME</button>
            </div>
            <div style="padding: 30px; ">
                <button type="button" class="btn btn-danger" style="padding: 40px; text-align:center; height:2in; width:2in; font-family: 'Roboto', sans-serif; border-radius:100%; font-weight:bold; font-size:35px; margin:auto;">STOP</button>
            </div>
        </div>
    </div>
    <script src="/app.js"></script>
</body>


</html>
